# Model basket. Ids and prices dated 03.09.2026 against the OpenRouter
# catalogue — these must be re-verified in the dashboard before any spend
# (IV-05), not trusted as still-current on the strength of this file alone.
#
# Catalogue re-verification (id exists, price matches, context window
# sufficient) and the IV-05 smoke call (model actually answers) are
# deliberately two separate checks — a model can still answer while having
# quietly changed price or been deprecated-but-still-served. This file
# records the FIRST half's starting point; IV-05 performs the check and
# updates `verified_at`/`verified_price_*` once run.

snapshot_date: "2026-09-03" # dated catalogue snapshot, not re-fetched yet
# IV-05 narrow smoke (2026-09-06): planner + fallback both returned valid
# structured output live (datasets/evidence/iv05_smoke_20260906T152356Z.json,
# gitignored). This confirms CALLABILITY only.
#
# Catalogue re-check (2026-09-06, scripts/iv05_catalogue_check.py against the
# live OpenRouter /api/v1/models, 430 entries): all ids still exist, all
# context windows still sufficient. Two price drifts found and corrected
# below (deepseek/deepseek-v4-flash-0731, z-ai/glm-5.3-flash).
verified_at: "2026-09-06"
smoke_tested_at: "2026-09-06" # connectivity/structured-output only

planner:
  model: "google/gemini-3.8-flash"
  price_usd_per_million:
    input: 0.75
    output: 3.75
  fallback: "z-ai/glm-5.3-flash"
  # Infrequent (once per session), context-heavy call — full diagnosis +
  # disclosure + 3-row channel comparison + the reviewed tool view. Sized
  # at ~30K in / ~4K out tokens; the window here has headroom over that
  # measured figure, not assumed to equal it exactly. No conversation
  # history is ever added on top (state lives in RecoveryState/Neon,
  # never an accumulated log).
  expected_tokens: { input: 30000, output: 4000 }
  context_window_min_tokens: 64000
  # The planner's JSON is never shown to the guest (it carries no
  # price/productId/availability fields at all — see
  # src/lantern/graph/schemas.py), so the language criterion for this
  # role is soft.
  language_criterion: soft

explainer:
  # UA-Eval full run (2026-09-06, 28 prompts x 4 candidates, judged by
  # x-ai/grok-4.6 against prompts/eval_judge_v1.md's rubric): the only
  # candidate that cleared the threshold (avg >= 4, zero critical
  # errors) on COMPLETE data (28/28 scored). deepseek-v4-flash-0731
  # (avg 4.50) and qwen3.8-flash (avg 4.43, after a retry that fixed an
  # OpenRouter rate-limit gap) both scored higher on average but carried
  # critical errors (Russianisms/surzhyk) that disqualify a candidate
  # regardless of the numeric score.
  selected: "google/gemini-3.5-flash-lite"
  # Frequent (once per ActionProposal, 2-3 per session), narrow call — one
  # candidate's own product_name/quantity/expected_delta, never the
  # session's full diagnosis or another candidate. Sized at ~6K in / ~1.2K
  # out — a fifth of the planner's input, so buying planner-sized context
  # headroom here would pay for capacity this prompt never uses. No
  # conversation history here either.
  expected_tokens: { input: 6000, output: 1200 }
  context_window_min_tokens: 16000
  candidates:
    - model: "google/gemini-3.5-flash-lite"
      price_usd_per_million: { input: 0.30, output: 2.50 }
    - model: "deepseek/deepseek-v4-flash-0731"
      # 2026-09-05: the bare "deepseek/deepseek-v4-flash" is a live alias,
      # not a pinned model id — it resolved to this dated id on that date.
      # Catalogue re-check (2026-09-06) found the dated id still resolves,
      # but its price drifted: was in=0.07/out=0.18 per 1M, live is
      # in=0.04998/out=0.09996 per 1M. Corrected here to the live value.
      price_usd_per_million: { input: 0.04998, output: 0.09996 }
    - model: "z-ai/glm-5.3-flash"
      # Catalogue re-check (2026-09-06): input drifted from 0.08 to 0.075
      # per 1M; output unchanged at 0.25. Corrected here.
      price_usd_per_million: { input: 0.075, output: 0.25 }
    - model: "qwen/qwen3.8-flash"
      # Filled in from the live catalogue (2026-09-06) — previously unpriced.
      price_usd_per_million: { input: 0.15, output: 0.47 }
  language_criterion: hard # UA-only, guest-facing

eval_judge:
  # G9 (D-G9-03 shortlist, 2026-09-09): cross-vendor to the planner
  # (google/*), to limit self-preference bias -- none of these are
  # Opus/GPT-5-flagship class, per the author's explicit exclusion.
  # Original x-ai/grok-4.6 candidate replaced: the author called its
  # $2.00/M input price "already fairly high" against a $20 ceiling that
  # covers the WHOLE PROJECT, not just this stage.
  candidates:
    - model: "openai/gpt-5.6-luna"
      price_usd_per_million: { input: 0.20, output: 1.20 }
    - model: "deepseek/deepseek-v3.2"
      price_usd_per_million: { input: 0.269, output: 0.40 }
    - model: "anthropic/claude-haiku-4.5"
      price_usd_per_million: { input: 1.00, output: 5.00 }
    - model: "moonshotai/kimi-k2-0905"
      price_usd_per_million: { input: 0.60, output: 2.50 }
      # Smoke test (2026-09-09) failed: "max_tokens: 100352 exceeds
      # maximum 98304" via the Novita provider route -- a config/routing
      # issue (OpenRouter's default max_tokens exceeds this provider's
      # own ceiling), not a quality signal. Left in the candidate list;
      # excluded from `selected` until the request is capped and retried.
    - model: "qwen/qwen3-235b-a22b-2507"
      price_usd_per_million: { input: 0.22, output: 0.88 }
      # Smoke test (2026-09-09) failed: "Evaluation LLM outputted an
      # invalid JSON" -- structured-output UNreliability actually
      # measured, not the `structured_outputs` catalogue flag's claim.
      # Disqualified for the judge role until/unless re-measured clean.
  # Smoke-tested live (2026-09-09, one example each, NOT a calibration
  # run): openai/gpt-5.6-luna, deepseek/deepseek-v3.2, and
  # anthropic/claude-haiku-4.5 all returned valid structured GEval scores
  # (0.9/1.0/0.9) in correct Ukrainian. Selected by the author's own
  # quality-then-cost call among the three that worked cleanly.
  selected: "openai/gpt-5.6-luna"
  calibrated: false # real judge agreement (kappa etc.) needs G9.2's golden-case
  # labeled pairs, which do not exist yet -- see D-G9-09. This selection
  # is provisional and may change once that calibration runs.

budgets:
  daily_soft_limit_usd: 3
  hard_limit_usd: 20
  # Stated envelope — see also src/lantern/graph/state.py's
  # MAX_CYCLES/MAX_MCP_ATTEMPTS/MAX_TOKENS/ACTIVE_EXECUTION_SECONDS, which
  # enforce these same numbers in code.
  max_cycles: 12
  max_mcp_attempts: 30
  max_tokens: 60000
  active_execution_seconds: 90

degradation_order:
  # "першим дешевшає explainer (A/B-кандидат), потім скорочуються
  # dev-прогони; planner деградує останнім."
  - explainer_ab_candidate
  - dev_runs
  - planner
