# Policy registry: validation_code -> rule, source, version, test_id,
# confidence. Six confirmed codes. Two live-observed codes are
# quarantined, never aliased to a similarly-named confirmed code.
entries:
  - code: order.cost.min
    rule: "DR-03: blocks checkout; gap = minOrderCost - productsTotal"
    source: "product requirements; confirmed against two live carts in both directions (blocked and clearing)"
    version: "1.0"
    test_id: DR-03
    confidence: confirmed
    status: active

  - code: product.offer.stock.max
    rule: "DR-08: stock-limited line item; propose an allowed quantity, never treat as not_found"
    source: "product requirements"
    version: "1.0"
    test_id: DR-08
    confidence: confirmed
    status: active

  - code: product.offer.not_found
    rule: "DR-07: unavailable line item; outranks stock.max within the same productId group"
    source: "product requirements"
    version: "1.0"
    test_id: DR-07
    confidence: confirmed
    status: active

  - code: timeslot.not_available
    rule: "DR-02: the selected delivery slot is no longer offered"
    source: "product requirements"
    version: "1.0"
    test_id: DR-02
    confidence: confirmed
    status: active

  - code: order.adult.is_not_confirmed
    rule: "DR-13: age confirmation stays the guest's own action; explain and route only"
    source: "product requirements"
    version: "1.0"
    test_id: DR-13
    confidence: confirmed
    status: active

  - code: order.payment_types.disabled
    rule: "Info-level disclosure only; never a blocker (DR-06 excludes info)"
    source: "product requirements; reconfirmed against a live capture 2026-09-06"
    version: "1.0"
    test_id: DR-06
    confidence: confirmed
    status: active

  # Observed live 2026-09-06, not in the six-code registry. Quarantined
  # until a documented release note or a re-run confirms whether this
  # is a genuine rename or a distinct new code.
  - code: product.offer.status.not_available
    rule: "Unregistered — disclose and flag, never alias to product.offer.not_found"
    source: "live capture 2026-09-06 — a validation code not in the confirmed six"
    version: "0.0-quarantined"
    test_id: DR-06
    confidence: unconfirmed
    status: quarantined

  - code: timeslot.not_found
    rule: "Unregistered — disclose and flag, never alias to timeslot.not_available"
    source: "live capture 2026-09-06 — a validation code not in the confirmed six"
    version: "0.0-quarantined"
    test_id: DR-06
    confidence: unconfirmed
    status: quarantined
