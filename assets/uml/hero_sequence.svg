<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-sequence-title hero-sequence-desc">
      <title id="hero-sequence-title">Hero recovery flow</title>
      <desc id="hero-sequence-desc">Sequence diagram of the hero recovery flow: the guest asks for help, the interface starts a recovery session, the agent reads the cart through the MCP adapter from the Silpo MCP server, streams a diagnosis with options, and after explicit consent performs one guarded write followed by an independent read-back before streaming the receipt.</desc>
      <defs><style>text{font-family:Arial,Helvetica,"Liberation Sans","DejaVu Sans",sans-serif;}</style>
        <marker id="arrow-filled" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#24242e"/></marker>
        <marker id="arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polyline points="0 0, 8 3.5, 0 7" fill="none" stroke="#6b7280" stroke-width="1.2"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- ============ LIFELINES ============ -->
      <line x1="120" y1="200" x2="120" y2="800" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="350" y1="200" x2="350" y2="800" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="580" y1="200" x2="580" y2="800" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="810" y1="200" x2="810" y2="800" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="1040" y1="200" x2="1040" y2="800" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- ============ ACTIVATION BARS ============ -->
      <rect x="344" y="248" width="12" height="504" fill="#e8ecf5" stroke="#6b7280" stroke-width="0.8"/>
      <rect x="574" y="296" width="12" height="432" fill="#e8ecf5" stroke="#6b7280" stroke-width="0.8"/>
      <rect x="804" y="344" width="12" height="152" fill="#e8ecf5" stroke="#6b7280" stroke-width="0.8"/>
      <rect x="804" y="632" width="12" height="72" fill="#e8ecf5" stroke="#6b7280" stroke-width="0.8"/>

      <!-- ============ MESSAGES ============ -->

      <!-- 1. Guest -> Interface -->
      <line x1="120" y1="248" x2="344" y2="248" stroke="#24242e" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="152" y="216" width="160" height="16" rx="2" fill="#ffffff"/>
      <text x="232" y="228" fill="#24242e" font-size="12" text-anchor="middle">1 · FIX WITH AI</text>

      <!-- 2. Interface -> Recovery Agent -->
      <line x1="356" y1="296" x2="574" y2="296" stroke="#24242e" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="392" y="264" width="148" height="16" rx="2" fill="#ffffff"/>
      <text x="466" y="276" fill="#24242e" font-size="12" text-anchor="middle">2 · START SESSION</text>

      <!-- 3. Recovery Agent -> MCP Adapter -->
      <line x1="586" y1="344" x2="804" y2="344" stroke="#24242e" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="628" y="312" width="132" height="16" rx="2" fill="#ffffff"/>
      <text x="694" y="324" fill="#24242e" font-size="12" text-anchor="middle">3 · READ CART</text>

      <!-- 4. MCP Adapter -> Silpo -->
      <line x1="816" y1="392" x2="1034" y2="392" stroke="#24242e" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="856" y="360" width="140" height="16" rx="2" fill="#ffffff"/>
      <text x="926" y="372" fill="#24242e" font-size="12" text-anchor="middle">4 · TOOLS/CALL</text>

      <!-- 5. Silpo -> MCP Adapter (return) -->
      <line x1="1034" y1="440" x2="820" y2="440" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="838" y="408" width="180" height="16" rx="2" fill="#ffffff"/>
      <text x="928" y="420" fill="#6b7280" font-size="12" text-anchor="middle">5 · CART + VALIDATIONS</text>

      <!-- 6. MCP Adapter -> Recovery Agent (return) -->
      <line x1="804" y1="488" x2="590" y2="488" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="620" y="456" width="152" height="16" rx="2" fill="#ffffff"/>
      <text x="696" y="468" fill="#6b7280" font-size="12" text-anchor="middle">6 · TYPED CART</text>

      <!-- 7. Recovery Agent self-message: diagnose + plan -->
      <path d="M 586,536 H 660 V 576 H 590" fill="none" stroke="#24242e" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="672" y="546" width="196" height="16" rx="2" fill="#ffffff"/>
      <text x="770" y="558" fill="#24242e" font-size="12" text-anchor="middle">7 · DIAGNOSE · GAP · PLAN</text>

      <!-- 8. Recovery Agent -> Interface (SSE push) -->
      <line x1="574" y1="608" x2="362" y2="608" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="376" y="576" width="184" height="16" rx="2" fill="#ffffff"/>
      <text x="468" y="588" fill="#6b7280" font-size="12" text-anchor="middle">8 · SSE: DIAGNOSIS + OPTIONS</text>

      <!-- 9. Guest -> Interface (consent) -->
      <line x1="120" y1="656" x2="344" y2="656" stroke="#24242e" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="140" y="624" width="184" height="16" rx="2" fill="#ffffff"/>
      <text x="232" y="636" fill="#24242e" font-size="12" text-anchor="middle">9 · CONSENT (action_id)</text>

      <!-- 10. Recovery Agent -> MCP Adapter (guarded write) -->
      <line x1="586" y1="680" x2="804" y2="680" stroke="#24242e" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="612" y="648" width="164" height="16" rx="2" fill="#ffffff"/>
      <text x="694" y="660" fill="#24242e" font-size="12" text-anchor="middle">10 · WRITE (1 TOOL)</text>

      <!-- 11. MCP Adapter -> Silpo (write then read-back) -->
      <line x1="816" y1="704" x2="1034" y2="704" stroke="#24242e" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="836" y="672" width="188" height="16" rx="2" fill="#ffffff"/>
      <text x="930" y="684" fill="#24242e" font-size="12" text-anchor="middle">11 · WRITE → READ-BACK</text>

      <!-- 12. Recovery Agent -> Interface (SSE receipt) -->
      <line x1="574" y1="752" x2="362" y2="752" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="392" y="720" width="152" height="16" rx="2" fill="#ffffff"/>
      <text x="468" y="732" fill="#6b7280" font-size="12" text-anchor="middle">12 · SSE: RECEIPT</text>

      <!-- ============ ACTOR BOXES ============ -->

      <!-- Guest (level 1: external) -->
      <rect x="20" y="110" width="200" height="90" rx="6" fill="#fdf9db" stroke="#c9ba5e" stroke-width="1"/>
      <rect x="32" y="122" width="40" height="16" rx="2" fill="transparent" stroke="#c9ba5e" stroke-width="0.8"/>
      <text x="52" y="134" fill="#24242e" font-size="12" text-anchor="middle">EXT</text>
      <text x="120" y="163" fill="#24242e" font-size="14" font-weight="700" text-anchor="middle">Guest</text>
      <text x="120" y="183" fill="#24242e" font-size="12" text-anchor="middle">browser / WebView</text>

      <!-- Interface (level 2) -->
      <rect x="250" y="110" width="200" height="90" rx="6" fill="#91ccf1" stroke="#2e7dbf" stroke-width="1"/>
      <rect x="262" y="122" width="28" height="16" rx="2" fill="transparent" stroke="#2e7dbf" stroke-width="0.8"/>
      <text x="276" y="134" fill="#24242e" font-size="12" text-anchor="middle">IF</text>
      <text x="350" y="163" fill="#24242e" font-size="14" font-weight="700" text-anchor="middle">Interface</text>
      <text x="350" y="183" fill="#24242e" font-size="12" text-anchor="middle">apps/api · apps/web</text>

      <!-- Recovery Agent (level 3) -->
      <rect x="480" y="110" width="200" height="90" rx="6" fill="#6ca2ee" stroke="#2c5fc9" stroke-width="1"/>
      <rect x="492" y="122" width="44" height="16" rx="2" fill="transparent" stroke="#2c5fc9" stroke-width="0.8"/>
      <text x="514" y="134" fill="#24242e" font-size="12" text-anchor="middle">APP</text>
      <text x="580" y="163" fill="#24242e" font-size="14" font-weight="700" text-anchor="middle">Recovery Agent</text>
      <text x="580" y="183" fill="#24242e" font-size="12" text-anchor="middle">LangGraph</text>

      <!-- MCP Adapter (level 5) -->
      <rect x="710" y="110" width="200" height="90" rx="6" fill="#afa4de" stroke="#7c6bc4" stroke-width="1"/>
      <rect x="722" y="122" width="52" height="16" rx="2" fill="transparent" stroke="#7c6bc4" stroke-width="0.8"/>
      <text x="748" y="134" fill="#24242e" font-size="12" text-anchor="middle">INFRA</text>
      <text x="810" y="163" fill="#24242e" font-size="14" font-weight="700" text-anchor="middle">MCP Adapter</text>
      <text x="810" y="183" fill="#24242e" font-size="12" text-anchor="middle">registry · guard</text>

      <!-- Silpo MCP (level 1: external) -->
      <rect x="940" y="110" width="200" height="90" rx="6" fill="#fdf9db" stroke="#c9ba5e" stroke-width="1"/>
      <rect x="952" y="122" width="40" height="16" rx="2" fill="transparent" stroke="#c9ba5e" stroke-width="0.8"/>
      <text x="972" y="134" fill="#24242e" font-size="12" text-anchor="middle">EXT</text>
      <text x="1040" y="163" fill="#24242e" font-size="14" font-weight="700" text-anchor="middle">Silpo MCP</text>
      <text x="1040" y="183" fill="#24242e" font-size="12" text-anchor="middle">mcp.silpo.ua</text>

      <!-- ============ LEGEND ============ -->
      <line x1="20" y1="850" x2="1140" y2="850" stroke="#d1d5db" stroke-width="0.8"/>
      <text x="20" y="872" fill="#6b7280" font-size="12" font-weight="700" letter-spacing="0.10em">LEGEND</text>

      <rect x="20" y="890" width="18" height="14" rx="2" fill="#fdf9db" stroke="#c9ba5e" stroke-width="1"/>
      <text x="46" y="901" fill="#24242e" font-size="12">External actor / service</text>

      <rect x="250" y="890" width="18" height="14" rx="2" fill="#91ccf1" stroke="#2e7dbf" stroke-width="1"/>
      <text x="276" y="901" fill="#24242e" font-size="12">Interface layer</text>

      <rect x="450" y="890" width="18" height="14" rx="2" fill="#6ca2ee" stroke="#2c5fc9" stroke-width="1"/>
      <text x="476" y="901" fill="#24242e" font-size="12">Application layer</text>

      <rect x="670" y="890" width="18" height="14" rx="2" fill="#afa4de" stroke="#7c6bc4" stroke-width="1"/>
      <text x="696" y="901" fill="#24242e" font-size="12">Infra / adapter layer</text>

      <rect x="890" y="886" width="8" height="20" fill="#e8ecf5" stroke="#6b7280" stroke-width="0.8"/>
      <text x="908" y="901" fill="#24242e" font-size="12">Activation</text>

      <line x1="20" y1="936" x2="60" y2="936" stroke="#24242e" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <text x="70" y="940" fill="#24242e" font-size="12">Synchronous call (UML)</text>

      <line x1="290" y1="936" x2="330" y2="936" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="342" y="940" fill="#24242e" font-size="12">Reply / async push (UML)</text>
    </svg>
