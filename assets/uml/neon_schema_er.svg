      <rect x="330" y="710" width="670" height="118" rx="8" fill="#fdf9db" stroke="#c9ba5e" stroke-width="1" stroke-dasharray="6,4"/>
      <text x="345" y="730" fill="#24242e" font-size="14" font-weight="700">LangGraph checkpointer  (owned by AsyncPostgresSaver, same Neon database)</text>
      <text x="345" y="752" fill="#24242e" font-size="12">checkpoints  ·  checkpoint_blobs  ·  checkpoint_writes  ·  checkpoint_migrations</text>
      <text x="345" y="772" fill="#6b7280" font-size="12">keyed by thread_id = sessions.thread_id; holds the serialised RecoveryState across the consent interrupt.</text>
      <text x="345" y="792" fill="#6b7280" font-size="12">No foreign key in either direction: the library owns its migrations, the application owns its rows.</text>
      <text x="345" y="812" fill="#6b7280" font-size="12">Migrated by the saver's own setup(), not by 0001-0009.</text>
      
      <!-- sessions 1 : 0..N consents (FK, no cascade). Lane y=290. -->
