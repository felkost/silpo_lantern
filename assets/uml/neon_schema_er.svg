      <title id="er-title">Lantern Neon schema</title>
      <desc id="er-desc">Entity-relationship diagram of the six application tables in Neon Postgres (schema_version, sessions, consents, idempotency_keys, receipts, oauth_tokens) with their columns, keys and relationships, and the LangGraph checkpointer tables the library owns, linked to sessions by thread_id without a foreign key.</desc>
