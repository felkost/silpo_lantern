# Services declared per plan section 8.2. No build context yet.
#
# an earlier decision supersedes this comment's original
# trigger condition ("Dockerfiles land, when there is application code
# to containerize"): the first stages do add apps/api application code, but plan
# section 14's own scaffold row does not name containerization as this stage's
# scope, and an earlier decision verifies "App starts" via `uvicorn apps.api.main:app`
# directly instead. Dockerfiles are deferred to whichever stage first needs
# a deployed container — the Render probe, at the latest. Declared now so
# the compose topology is reviewable at kickoff, matching plan section 1.6's
# naming rule (same names locally and in the cloud).
services:
  lantern-api:
    build: ./apps/api
    env_file: .env
    ports:
      - "8000:8000"
    profiles: ["not-yet-buildable"]

  lantern-web:
    build: ./apps/web
    env_file: .env
    ports:
      - "5173:5173"
    profiles: ["not-yet-buildable"]
