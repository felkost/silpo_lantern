# Services declared per plan section 8.2. No build context yet — Dockerfiles
# for apps/api and apps/web land at G1, when there is application code to
# containerize. Declared now so the compose topology is reviewable at
# kickoff, matching plan section 1.6's naming rule (same names locally and
# in the cloud).
services:
  lantern-api:
    build: ./apps/api
    env_file: .env
    ports:
      - "8000:8000"
    profiles: ["not-yet-buildable"]

  lantern-web:
    build: ./apps/web
    env_file: .env
    ports:
      - "5173:5173"
    profiles: ["not-yet-buildable"]
