[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# `import deepeval` calls load_dotenv() and injects the whole .env into
# os.environ. Because deepeval ships a pytest plugin, that happened on every
# run — the offline gate saw real credentials, and the integration tests'
# "skip unless DATABASE_URL is set" guard never fired on a machine that has a
# .env file (measured at G1+G2 close: 5 passed instead of 5 skipped).
# The eval suite re-enables the plugin explicitly when it is built at G8+G9.
addopts = "-p no:deepeval"
markers = [
    "xfail_strict: declared-failing tests for domain rules not yet implemented",
]
